[package]
name = "tano"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.12", features = ["blocking", "cookies"] }
cookie_store = "0.22"
encoding_rs = "0.8"
color-eyre = "0.6"
regex-lite = "0.1"
scraper = "0.24"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
